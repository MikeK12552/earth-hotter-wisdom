<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate security weekly · Map</title>
<!-- d3, topojson and the world atlas all come from jsdelivr: the basemap needs that
     origin anyway, so serving the libraries from it too means one CDN to be reachable
     rather than two. The integrity hashes are unchanged — jsdelivr and unpkg serve
     byte-identical files for a pinned npm version, checked before the switch. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
:root{
  --paper:#edf0f1; --card:#f7f9f9; --ink:#131b21; --muted:#5d6e78;
  --rule:#c4d0d6; --rule-soft:#dbe3e7;
  --evidence:#1e4a52; --contested:#5b4a86; --framing:#8a6a1f; --gap:#7b7f82;
  --red:#b3362b;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  font-variant-numeric:oldstyle-nums;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:18px 24px 14px;border-bottom:1px solid var(--rule);flex:none}
.mast{font-size:22px;line-height:1.1;font-weight:500;letter-spacing:-.01em;margin:0}
.mast span{display:block;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--muted);margin-top:5px}
.wk{text-align:right;min-width:0}
.wk .range{font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
.wk .no{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:3px}
.wk a{font-family:var(--sans);font-size:13px;color:var(--ink);display:inline-block;margin-top:6px}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;contain:layout paint}
#stage:active{cursor:grabbing}
#base,#marks,#heat{position:absolute;inset:0;width:100%;height:100%}
#heat{pointer-events:none;mix-blend-mode:multiply;contain:strict;transform-origin:0 0;will-change:transform}
#marks{pointer-events:none}
#marks .mk{pointer-events:auto;cursor:pointer}
.country{fill:var(--card);stroke:var(--rule);stroke-width:.6;vector-effect:non-scaling-stroke}
.sphere{fill:none;stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:var(--rule-soft);stroke-width:.5;vector-effect:non-scaling-stroke}

.mk .bg{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.mk.dev .bg{fill:var(--ink);stroke:var(--card)}
.mk.dev .ic{stroke:var(--card)}
.mk.move .bg{stroke:var(--contested);stroke-width:1.5}
.mk.move .ic{stroke:var(--contested)}
.mk.inst .bg{fill:var(--paper);stroke:var(--gap);stroke-width:1.2}
.mk .ic{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mk.sel .bg{stroke:var(--red);stroke-width:2.5}
.mk:hover .bg{stroke-width:2.5}
.link{fill:none;stroke:var(--framing);stroke-width:1.4;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.link-head{fill:var(--framing)}

/* panel */
#panel{position:absolute;left:18px;top:18px;width:232px;max-height:calc(100% - 36px);overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:2px;
  font-family:var(--sans);font-size:13px;padding:14px 16px 12px;box-shadow:0 1px 2px rgba(19,27,33,.06)}
#panel h4{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted)}
/* The toggle only exists on a narrow screen, where the panel would otherwise cover
   nearly half the map. Desktop keeps the panel open with no chrome. */
#panelToggle{display:none;align-items:center;gap:8px;width:100%;background:none;border:0;
  padding:0;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;
  letter-spacing:.03em;color:var(--muted);text-align:left}
#panelToggle .car{margin-left:auto;font-size:11px;transition:transform .15s}
#panel.min #panelToggle .car{transform:rotate(-90deg)}
#panel h4+h4{margin-top:16px}
.lay{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;user-select:none}
.lay input{appearance:none;width:26px;height:16px;border-radius:9px;background:var(--rule);position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.lay input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--card);transition:transform .15s}
.lay input:checked{background:var(--ink)}
.lay input:checked::after{transform:translateX(10px)}
.lay .sw{width:14px;height:14px;flex:none}
.lay .sw.dev{background:var(--ink);border-radius:50%}
.lay .sw.move{border:1.5px solid var(--contested);border-radius:50%}
.lay .sw.inst{border:1.2px solid var(--gap);transform:rotate(45deg) scale(.7)}
.lay .sw.link{border-top:1.5px dashed var(--framing);height:0}
.lay .sw.heat{background:linear-gradient(90deg,#fff,var(--red))}
.leg{display:grid;grid-template-columns:18px 1fr;gap:4px 10px;align-items:center;color:var(--muted);font-size:12.5px}
.leg svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cnt{margin-top:14px;padding-top:10px;border-top:1px solid var(--rule-soft);color:var(--muted);font-size:12px;line-height:1.5}
.cnt b{font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);margin-right:3px}

/* popover */
/* The card is a column: a fixed heading, a body that scrolls, and the digest link
   pinned at the bottom. Without the cap it grew past the stage, and #stage clips its
   overflow, so on a phone a long summary put the button 160px below the last visible
   pixel with nothing to scroll. */
#pop{position:absolute;width:340px;max-width:calc(100% - 36px);max-height:calc(100% - 24px);
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:16px 18px 14px;box-shadow:0 6px 24px rgba(19,27,33,.12);display:none;z-index:5;
  flex-direction:column}
#pop.on{display:flex}
#pop .bod{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pop .bod p:last-child{margin-bottom:0}
#pop .go{flex:none;align-self:flex-start;margin-top:12px}
/* A hairline that only appears when there is more text above the fold, so the reader
   can tell the body is scrollable rather than simply ended. */
#pop.scrolls .bod{border-bottom:1px solid var(--rule-soft);padding-bottom:12px}
#pop .kind{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
#pop .kind .x{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 0 0 8px;font-size:15px;line-height:1}
#pop h3{font-size:18px;line-height:1.25;font-weight:500;margin:6px 0 4px;letter-spacing:-.01em}
#pop .meta{font-family:var(--sans);font-size:12px;color:var(--muted);margin:0 0 10px}
#pop p{margin:0 0 10px;font-size:15px;line-height:1.5}
#pop .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:2px 7px;border:1px solid currentColor;border-radius:2px;color:var(--muted)}
.tag.evidence,.tag.landed{color:var(--evidence)}
.tag.too_early,.tag.framing{color:var(--framing)}
.tag.failed,.tag.contested{color:var(--contested)}
.tag.gap{color:var(--gap);border-style:dashed}
#pop .go{display:inline-block;padding:8px 14px;border:1px solid var(--ink);background:none;font-family:var(--sans);font-size:13px;text-decoration:none;border-radius:2px}
#pop .go:hover{background:var(--ink);color:var(--paper)}

/* timeline */
footer{flex:none;border-top:1px solid var(--rule);background:var(--card);padding:12px 24px 14px;display:flex;align-items:center;gap:18px;font-family:var(--sans)}
footer .nav{background:none;border:1px solid var(--rule);width:32px;height:32px;border-radius:2px;cursor:pointer;color:var(--ink);font-size:15px;flex:none}
footer .nav:disabled{opacity:.35;cursor:default}
footer .nav:not(:disabled):hover{border-color:var(--ink)}
#weeks{flex:1 1 0;min-width:0;position:relative;height:48px;scrollbar-width:none;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden}
#weeks .line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
#weeks .tick{position:relative;flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0;color:var(--muted);font-size:11.5px}
#weeks .tick i{display:block;width:10px;height:10px;border-radius:50%;background:var(--card);border:1.5px solid var(--rule);transition:all .15s}
#weeks .tick:hover i{border-color:var(--ink)}
#weeks .tick[aria-current="true"]{color:var(--ink);font-weight:600}
#weeks .tick[aria-current="true"] i{background:var(--ink);border-color:var(--ink);transform:scale(1.25)}
#weeks .tick.future i{border-style:dashed}
#weeks .tick.future{cursor:default}
footer .hint{color:var(--muted);font-size:12px;flex:none}
#weeks::-webkit-scrollbar{display:none}
#weeks .tick span{white-space:nowrap}
nav.bar{flex:none;display:flex;background:var(--card);border-top:1px solid var(--rule)}
nav.bar button{flex:1;background:none;border:0;padding:13px 0;font-family:var(--sans);font-size:13.5px;color:var(--muted);cursor:pointer}
nav.bar button[aria-current="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--ink)}
.state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;pointer-events:none}
@media (max-width:720px){
  #pop{width:300px}
  header{padding:14px 16px 10px}
  .wk .range{font-size:16px}
  footer{padding:10px 12px;gap:10px}
  /* Portrait was wrapping the masthead onto two lines and breaking the digest link
     across the arrow. Smaller type, and the row lays out left-to-right instead. */
  header{align-items:center;gap:12px}
  .mast{font-size:17px}
  .mast span{font-size:11px;margin-top:3px}
  .wk .range{font-size:14px;line-height:1.2}
  .wk .no{font-size:11px;margin-top:1px}
  .wk a{font-size:12px;margin-top:3px;white-space:nowrap}
  /* The hint is desktop advice — there are no arrow keys and no scroll wheel on a
     phone — and at 270px it was squeezing the timeline to nothing. */
  footer .hint{display:none}
  #panel{left:12px;top:12px;width:auto;max-width:calc(100% - 24px);font-size:12.5px;padding:10px 12px}
  #panelToggle{display:flex}
  #panel.min{padding:8px 12px}
  #panel.min #panelBody{display:none}
  #panelBody{margin-top:12px}
}
</style>
</head>
<body>
<header>
  <h1 class="mast">Climate security weekly<span>Map of the week</span></h1>
  <div class="wk">
    <div class="range" id="wkRange">&nbsp;</div>
    <div class="no" id="wkNo"></div>
    <a id="wkLink" href="index.html">Read the full digest →</a>
  </div>
</header>

<div id="stage">
  <svg id="base"><g id="gBase"></g></svg>
  <canvas id="heat"></canvas>
  <svg id="marks"><g id="gMarks"><g id="gLinks"></g><g id="gInst"></g><g id="gItems"></g></g></svg>
  <div id="panel">
    <button id="panelToggle" aria-expanded="true" aria-controls="panelBody">
      <span>Layers and legend</span><span class="car" aria-hidden="true">▾</span>
    </button>
    <div id="panelBody">
    <h4>Layers</h4>
    <label class="lay"><input type="checkbox" data-layer="dev" checked><span class="sw dev"></span>Key developments</label>
    <label class="lay"><input type="checkbox" data-layer="moves" checked><span class="sw move"></span>Player moves</label>
    <label class="lay"><input type="checkbox" data-layer="links" checked><span class="sw link"></span>Move responds to event</label>
    <label class="lay"><input type="checkbox" data-layer="inst"><span class="sw inst"></span>Institutes and centres</label>
    <label class="lay"><input type="checkbox" data-layer="heat" checked><span class="sw heat"></span>Concentration</label>
    <h4>Event types this week</h4>
    <div class="leg" id="legend"></div>
    <div class="cnt" id="counts"></div>
    </div>
  </div>
  <div id="pop" role="dialog"></div>
  <div class="state" id="state">Loading map…</div>
</div>

<footer>
  <button class="nav" id="prev" aria-label="Previous week">‹</button>
  <div id="weeks"><div class="line"></div></div>
  <button class="nav" id="next" aria-label="Next week">›</button>
  <span class="hint">← → to move between weeks · scroll to zoom</span>
</footer>
<nav class="bar">
  <button onclick="location.href='index.html'">Digests</button>
  <button onclick="location.href='index.html?view=tracker'">Tracker</button>
  <button aria-current="true">Map</button>
</nav>

<script>
const KINDS = {
  glacier:     {label:"Slope failure / flood cascade", d:"M3 19 9 8l4 6 3-5 5 10zM9 8l1 4-2 3"},
  flood:       {label:"Flooding", d:"M3 10c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"},
  drought:     {label:"Drought / water shortage", d:"M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11zM5 19 19 5"},
  displacement:{label:"Displacement", d:"M2 20c0-4 3-6 6-6s6 2 6 6M8 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6M15 9h7m-3-3 3 3-3 3"},
  fire:        {label:"Wildfire", d:"M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 2 2 2 4 1-2 1-5 1-8z"},
  summit:      {label:"Summit / multilateral meeting", d:"M9 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10M15 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10"},
  law:         {label:"Court / arbitration", d:"M12 3v18M5 8h14M5 8l-3 6h6l-3-6M19 8l-3 6h6l-3-6M8 21h8"},
  shield:      {label:"Security / sovereignty", d:"M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"},
  report:      {label:"Report / assessment", d:"M6 3h9l4 4v14H6zM15 3v4h4M9 12h6M9 16h6"},
  statement:   {label:"Statement", d:"M4 5h16v11H9l-5 4z"},
  research:    {label:"Research finding", d:"M10 16a6 6 0 1 0 0-12 6 6 0 0 0 0 12M14.5 14.5 21 21"},
  government:  {label:"Government decision", d:"M5 21V4M5 4h13l-2 4 2 4H5"},
  institute:   {label:"Institute / centre", d:"M3 21h18M4 9h16M12 3l8 6H4zM6 9v12M10 9v12M14 9v12M18 9v12"}
};
const ARCS = {novel:"Novel",repeat:"Repeat","repeat-accelerating":"Repeat, accelerating",acceleration:"Acceleration","standing-correction":"Standing correction"};
const ATTRIB = {study_exists:"Attribution study exists",no_study:"No attribution study",none_claimed:"No attribution claimed",natural_variability:"Natural variability",not_applicable:"Attribution n/a"};
const VERDICTS = {landed:"Landed",failed:"Failed",too_early:"Too early to tell"};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = iso => { const d = new Date(iso+"T00:00:00"); return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-GB",{day:"numeric",month:"long"}); };
const fmtRange = (a,b) => { const s=new Date(a+"T00:00:00"), e=new Date(b+"T00:00:00");
  return s.toLocaleDateString("en-GB",{day:"numeric",month:s.getMonth()===e.getMonth()?undefined:"long"})+" to "+e.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); };

// The pin text is the digest's own opening paragraph with the markdown stripped. The
// design had a hand-written summary per pin; that would be a second copy of the same
// prose, free to drift away from the digest it describes.
const firstPara = body => String(body||"").split(/\n{2,}/)[0]
  .replace(/\[([^\]]+)\]\([^)\s]+\)/g,"$1")
  .replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*\n]+)\*/g,"$1")
  .replace(/`([^`]+)`/g,"$1").replace(/\n/g," ").trim();

const KINDMARK = {event:"where it happened", institution:"where the actor sits",
                  jurisdiction:"what it is about"};

const stage = document.getElementById("stage"), canvas = document.getElementById("heat"), ctx = canvas.getContext("2d");
const svgBase = d3.select("#base"), gBase = d3.select("#gBase"), svgMarks = d3.select("#marks"), gMarks = d3.select("#gMarks");
const gLinks = d3.select("#gLinks"), gInst = d3.select("#gInst"), gItems = d3.select("#gItems");
const pop = document.getElementById("pop");

let W, H, projection, path, land, index, institutes = [], digests = {};
let weekId = null, items = [], instItems = [], selected = null;
let t = d3.zoomIdentity;
const layers = {dev:true, moves:true, links:true, inst:false, heat:true};

// heat colour LUT: white → red
const ramp = d3.interpolateRgb("#f3d9d5", "#b3362b");
const LUT = d3.range(256).map(i => { const v=i/255; const c=d3.rgb(ramp(Math.min(1,v*1.15))); return [c.r,c.g,c.b,Math.round(Math.min(1,v*1.7)*255)]; });

// The heat field is a full-screen canvas composited with mix-blend-mode: multiply. On a
// phone, recomputing its pixels every frame of a pinch is what made the map crawl — the
// JavaScript is nothing, the rasterising is everything.
//
// So during a gesture the bitmap is not redrawn; it is carried along with a CSS
// transform instead, which the compositor can do on the GPU. The heat stays on screen
// and tracks the map, and the exact redraw happens once the gesture ends. Hiding it
// outright was the first attempt and it read as a flicker: gone while you drag, back
// with a jolt when you stop.
//
// The blob radius grows with zoom (75*sqrt(k)), so a scaled bitmap is very slightly off
// from a fresh one mid-pinch. It is a blur; the discrepancy is invisible, and the
// redraw on release settles it.
let interacting = false, t0 = null;
function heatTrack(){
  if(!t0 || !layers.heat) return;
  const r = t.k / t0.k;
  canvas.style.transform =
    `translate(${t.x - r*t0.x}px,${t.y - r*t0.y}px) scale(${r})`;
}
const zoom = d3.zoom().scaleExtent([1,14])
  .on("start", e => { if(e.sourceEvent){ interacting = true; t0 = t; } })
  .on("zoom",  e => { if(e.sourceEvent) focusItem = null; t = e.transform; apply(); if(interacting) heatTrack(); })
  .on("end",   () => { if(interacting){ interacting = false; t0 = null; canvas.style.transform = ""; drawHeat(); } });
svgMarks.call(zoom).on("dblclick.zoom", null);
d3.select("#marks").style("pointer-events","auto");

async function boot(){
  const [topo, idx, inst] = await Promise.all([
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json()),
    fetch("data/index.json",{cache:"no-cache"}).then(r=>r.json()),
    fetch("data/institutes.json",{cache:"no-cache"}).then(r=>r.json()).catch(()=>[])
  ]);
  land = topojson.feature(topo, topo.objects.countries);
  index = idx; institutes = inst;
  index.digests.sort((a,b)=>a.week_start.localeCompare(b.week_start));
  document.getElementById("state").style.display="none";
  new ResizeObserver(fit).observe(stage);
  window.addEventListener("resize", fit);
  document.addEventListener("visibilitychange", fit);
  resize();
  buildTimeline();
  const params = new URLSearchParams(location.search);
  const want = params.get("week") || localStorage.getItem("csw-map-week");
  const focus = params.get("focus");
  await selectWeek(index.digests.some(d=>d.id===want) ? want : index.digests[index.digests.length-1].id);
  focusItem = focus && items.find(o=>o.id===focus) || null;
  if(focusItem) focusOn(true);
  document.querySelectorAll("[data-layer]").forEach(cb => cb.addEventListener("change", () => { layers[cb.dataset.layer]=cb.checked; if(cb.dataset.layer==="heat") canvas.style.transform=""; if(!cb.checked && selected && ((selected.type==="inst"&&cb.dataset.layer==="inst")||(selected.type==="dev"&&cb.dataset.layer==="dev")||(selected.type==="move"&&cb.dataset.layer==="moves"))) closePop(); render(); }));
  // Collapsed by default on a phone, where the open panel covered nearly half the map.
  const panel = document.getElementById("panel"), pt = document.getElementById("panelToggle");
  const narrowPanel = () => window.matchMedia("(max-width:720px)").matches;
  const setPanel = min => {
    panel.classList.toggle("min", min);
    pt.setAttribute("aria-expanded", String(!min));
    if(narrowPanel()) localStorage.setItem("csw-map-panel", min ? "min" : "open");
  };
  setPanel(narrowPanel() && localStorage.getItem("csw-map-panel") !== "open");
  pt.addEventListener("click", () => setPanel(!panel.classList.contains("min")));
  // Coming back to a wide screen should never leave the panel stuck shut.
  window.matchMedia("(max-width:720px)").addEventListener("change", e =>
    setPanel(e.matches && localStorage.getItem("csw-map-panel") !== "open"));

  document.getElementById("prev").addEventListener("click", ()=>step(-1));
  document.getElementById("next").addEventListener("click", ()=>step(1));
  window.addEventListener("keydown", e => { if(e.key==="ArrowLeft") step(-1); else if(e.key==="ArrowRight") step(1); else if(e.key==="Escape") closePop(); });
  svgMarks.on("click", e => { if(e.target===svgMarks.node()) closePop(); });
}

function resize(){
  W = stage.clientWidth || 800; H = stage.clientHeight || 400;
  canvas.width = W; canvas.height = H; sizeHeat();
  projection = d3.geoNaturalEarth1().fitExtent([[12,12],[W-12,H-12]], {type:"Sphere"});
  path = d3.geoPath(projection);
  gBase.html("");
  gBase.append("path").attr("class","sphere").attr("d", path({type:"Sphere"}));
  gBase.append("path").attr("class","grat").attr("d", path(d3.geoGraticule().step([30,30])()));
  gBase.selectAll("path.country").data(land.features).join("path").attr("class","country").attr("d", path);
}

function step(n){
  const i = index.digests.findIndex(d=>d.id===weekId), j = i+n;
  if(j<0 || j>=index.digests.length) return;
  selectWeek(index.digests[j].id);
}

function buildTimeline(){
  const wrap = document.getElementById("weeks");
  wrap.querySelectorAll(".tick").forEach(x=>x.remove());
  index.digests.forEach(d => {
    const b = document.createElement("button"); b.className="tick"; b.dataset.id=d.id;
    const s=new Date(d.week_start+"T00:00:00"), e=new Date(d.week_end+"T00:00:00");
    b.innerHTML = `<i></i><span>W${d.week_number} · ${s.getDate()}–${e.getDate()} ${e.toLocaleDateString("en-GB",{month:"short"})}</span>`;
    b.addEventListener("click", ()=>selectWeek(d.id));
    wrap.appendChild(b);
  });
  // next, unpublished week as a dashed tick so the rhythm is visible
  const last = index.digests[index.digests.length-1];
  const ns = new Date(last.week_end+"T00:00:00"); ns.setDate(ns.getDate()+1);
  const ne = new Date(ns); ne.setDate(ne.getDate()+6);
  const f = document.createElement("div"); f.className="tick future";
  f.innerHTML = `<i></i><span>W${last.week_number+1} · ${ns.getDate()}–${ne.getDate()} ${ne.toLocaleDateString("en-GB",{month:"short"})}</span>`;
  wrap.appendChild(f);
}

async function selectWeek(id){
  weekId = id; localStorage.setItem("csw-map-week", id);
  focusItem = null;
  history.replaceState(null,"", "?week="+id);
  closePop();
  if(!digests[id]) digests[id] = await fetch(`data/digests/${id}.json`,{cache:"no-cache"}).then(r=>r.json());
  const d = digests[id];
  document.getElementById("wkRange").textContent = fmtRange(d.week_start, d.week_end);
  document.getElementById("wkNo").textContent = `Week ${d.week_number}`;
  document.getElementById("wkLink").href = `index.html?id=${id}`;
  document.querySelectorAll("#weeks .tick").forEach(x => x.setAttribute("aria-current", x.dataset.id===id));
  const i = index.digests.findIndex(x=>x.id===id);
  document.getElementById("prev").disabled = i<=0; document.getElementById("next").disabled = i>=index.digests.length-1;

  // Markers come from the digest's own `locations`, not a parallel geo file: one source
  // of truth, validated by the build, and no summary prose to drift out of step. An item
  // with several locations gets a marker each — the Nepal-China flood is two, one either
  // side of the border — so `key` disambiguates while `id` still addresses the item.
  items = [];
  const pins = (arr, type, prefix) => (arr||[]).forEach(src => {
    (src.locations||[]).forEach((L,i) => items.push({
      id: prefix+src.n, key: `${prefix}${src.n}#${i}`, type, src,
      lat: L.lat, lon: L.lon, icon: L.icon, geoKind: L.kind, precision: L.precision,
      label: L.name, locNote: L.note,
      title: src.title, date: src.date, place: L.name,
      responds_to: i === 0 ? src.responds_to : null,   // one arrow per item, not per pin
      summary: firstPara(src.body)
    }));
  });
  pins(d.developments, "dev", "b");
  pins(d.moves, "move", "d");
  instItems = institutes.map((x,k)=>({...x, id:"i"+k, key:"i"+k, type:"inst", icon:"institute",
                                      lon:x.lon, title:x.name, place:x.city}));
  layout(); render();
  fit(); (function retry(n){ setTimeout(() => { fit(); if(n>0) retry(n-1); }, 200); })(25);
}

// re-fit whenever the measured stage size differs from the fitted one (setTimeout fires even in hidden tabs)
function fit(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if(w && h && (w!==W || h!==H)){ resize(); layout(); apply(); if(focusItem) focusOn(false); }
}

// centre and zoom on a focused item; stays pinned through re-fits until the user pans/zooms
let focusItem = null;
function focusOn(animate){
  const o = focusItem, k = 3;
  const tf = d3.zoomIdentity.translate(W/2 - k*o.x, H/2 - k*o.y).scale(k);
  if(animate && document.visibilityState === "visible"){
    svgMarks.transition().duration(700).call(zoom.transform, tf).on("end", () => openPop(o));
  } else { svgMarks.call(zoom.transform, tf); openPop(o); }
}

// project + spread co-located markers
function layout(){
  const all = items.concat(instItems);
  all.forEach(o => { const p = projection([o.lon,o.lat]); o.x=p[0]; o.y=p[1]; o.dx=0; o.dy=0; });
  const groups = d3.group(all.filter(o => o.type!=="inst" || layers.inst), o => `${Math.round(o.lat*2)},${Math.round(o.lon*2)}`);
  groups.forEach(arr => {
    if(arr.length<2) return;
    const r = 15 + arr.length*2;
    arr.forEach((o,i) => { const a = -Math.PI/2 + i*2*Math.PI/arr.length; o.dx = r*Math.cos(a); o.dy = r*Math.sin(a); });
  });
}

function visible(o){ return o.type==="dev" ? layers.dev : o.type==="move" ? layers.moves : layers.inst; }

function render(){
  layout();
  const shown = items.filter(visible);
  gItems.selectAll("g.mk").data(shown, o=>o.key).join(enter => {
      const g = enter.append("g").attr("class", o=>`mk ${o.type}`);
      g.append("circle").attr("class","bg").attr("r",13);
      g.append("path").attr("class","ic").attr("d", o=>(KINDS[o.icon]||KINDS.report).d).attr("transform","translate(-8,-8) scale(.667)");
      g.append("title").text(o=>o.title);
      g.on("click", (e,o)=>{ e.stopPropagation(); openPop(o); });
      return g;
    }).classed("sel", o => selected && selected.key===o.key);

  gInst.selectAll("g.mk").data(layers.inst ? instItems : [], o=>o.key).join(enter => {
      const g = enter.append("g").attr("class","mk inst");
      g.append("rect").attr("class","bg").attr("x",-6).attr("y",-6).attr("width",12).attr("height",12).attr("transform","rotate(45)");
      g.append("title").text(o=>`${o.name}, ${o.city}`);
      g.on("click", (e,o)=>{ e.stopPropagation(); openPop(o); });
      return g;
    }).classed("sel", o => selected && selected.key===o.key);

  // links: responds_to
  const links = layers.links ? shown.filter(o=>o.responds_to).map(o => ({from: items.find(x=>x.id===o.responds_to), to:o})).filter(l=>l.from && visible(l.from)) : [];
  gLinks.selectAll("path.link").data(links, l=>l.from.key+">"+l.to.key).join("path").attr("class","link");
  gLinks.selectAll("path.link-head").data(links, l=>l.from.key+">"+l.to.key).join("path").attr("class","link-head");

  // legend + counts
  const kinds = [...new Set(shown.map(o=>o.icon).filter(k=>KINDS[k]))];
  document.getElementById("legend").innerHTML = kinds.map(k => `<svg viewBox="0 0 24 24"><path d="${KINDS[k].d}"/></svg><span>${KINDS[k].label}</span>`).join("") || `<span style="grid-column:1/-1">Nothing shown</span>`;
  const nd = new Set(items.filter(o=>o.type==="dev").map(o=>o.id)).size,
        nm = new Set(items.filter(o=>o.type==="move").map(o=>o.id)).size;
  document.getElementById("counts").innerHTML = `<b>${nd}</b>developments &nbsp; <b>${nm}</b>player moves`;
  apply();
}

// zoom transform: move groups, keep markers a constant screen size, redraw heat
function apply(){
  const k = t.k;
  gBase.attr("transform", t); gMarks.attr("transform", t);
  gMarks.selectAll("g.mk").attr("transform", o => `translate(${o.x + o.dx/k},${o.y + o.dy/k}) scale(${1/k})`);
  gLinks.selectAll("path.link").attr("d", l => {
    const x1=l.from.x+l.from.dx/k, y1=l.from.y+l.from.dy/k, x2=l.to.x+l.to.dx/k, y2=l.to.y+l.to.dy/k;
    const mx=(x1+x2)/2, my=(y1+y2)/2, ddx=x2-x1, ddy=y2-y1, len=Math.hypot(ddx,ddy)||1;
    const cx = mx - ddy/len*len*0.18, cy = my + ddx/len*len*0.18;
    l.cx=cx; l.cy=cy; return `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
  });
  gLinks.selectAll("path.link-head").attr("d", l => {
    const x2=l.to.x+l.to.dx/k, y2=l.to.y+l.to.dy/k;
    const ang = Math.atan2(y2-l.cy, x2-l.cx); const s = 1/k, back = 15*s;
    const px = x2 - Math.cos(ang)*back, py = y2 - Math.sin(ang)*back;
    const a1 = ang+Math.PI*0.82, a2 = ang-Math.PI*0.82, L=7*s;
    return `M${px},${py} L${px+Math.cos(a1)*L},${py+Math.sin(a1)*L} L${px+Math.cos(a2)*L},${py+Math.sin(a2)*L} Z`;
  });
  drawHeat(); positionPop();
}

// The heat field is a blur, so it is drawn at half resolution and scaled up: a quarter
// of the pixels through the per-pixel recolour, which is the expensive part and ran on
// every pan and zoom frame. The scratch canvas is allocated once per resize rather than
// once per frame — on a phone the old version churned a full-size canvas 60 times a
// second and the map crawled.
const HEAT_SCALE = 0.5;
let heatFrame = 0, off = document.createElement("canvas"), oc = off.getContext("2d", {willReadFrequently:true});
let hw = 0, hh = 0;
function sizeHeat(){
  hw = Math.max(1, Math.round(W*HEAT_SCALE)); hh = Math.max(1, Math.round(H*HEAT_SCALE));
  off.width = hw; off.height = hh;
}
function drawHeat(){
  cancelAnimationFrame(heatFrame);
  heatFrame = requestAnimationFrame(() => {
    // Order matters. While a gesture runs, the existing bitmap is being carried by a CSS
    // transform and must survive untouched: clearing first and returning second wiped it
    // on the opening frame of every drag, so the heat still vanished — the transform was
    // faithfully carrying an empty canvas.
    if(interacting) return;
    ctx.clearRect(0,0,W,H);
    if(!layers.heat) return;
    if(off.width !== Math.round(W*HEAT_SCALE)) sizeHeat();
    const pts = items.filter(visible).map(o => [t.applyX(o.x)*HEAT_SCALE, t.applyY(o.y)*HEAT_SCALE]);
    if(!pts.length) return;
    oc.clearRect(0,0,hw,hh);
    const R = Math.min(200, 75*Math.sqrt(t.k)) * HEAT_SCALE;
    let drew = false;
    pts.forEach(([x,y]) => {
      if(x<-R||y<-R||x>hw+R||y>hh+R) return;
      const g = oc.createRadialGradient(x,y,0,x,y,R);
      g.addColorStop(0,"rgba(0,0,0,.5)"); g.addColorStop(.45,"rgba(0,0,0,.18)"); g.addColorStop(1,"rgba(0,0,0,0)");
      oc.fillStyle = g; oc.beginPath(); oc.arc(x,y,R,0,Math.PI*2); oc.fill(); drew = true;
    });
    if(!drew) return;
    const img = oc.getImageData(0,0,hw,hh), d = img.data;
    for(let i=0;i<d.length;i+=4){ const a=d[i+3]; if(!a) continue; const c=LUT[a]; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=c[3]; }
    oc.putImageData(img,0,0);
    ctx.drawImage(off, 0, 0, hw, hh, 0, 0, W, H);
  });
}

function openPop(o){
  selected = o;
  gMarks.selectAll("g.mk").classed("sel", x => x.key===o.key);
  const K = KINDS[o.icon]||KINDS.report;
  let html = `<div class="kind"><span>${o.type==="dev"?"Key development":o.type==="move"?"Player move":"Institute"} · ${K.label}</span><button class="x" aria-label="Close">×</button></div>`;
  let foot = "";
  html += `<div class="bod">`;
  if(o.type==="inst"){
    html += `<h3>${esc(o.name)}</h3><p class="meta">${esc(o.city)} &nbsp;·&nbsp; ${esc(o.role)}</p><p>${esc(o.note)}</p>`;
  } else {
    const s = o.src, d = digests[weekId];
    html += `<h3>${esc(o.title)}</h3><p class="meta">${fmtDate(o.date)}${o.place?`, ${esc(o.place)}`:""}${o.type==="move"&&s.actor?`<br>${esc(s.actor)}`:""}</p>`;
    const tags = [];
    if(o.type==="dev"){ if(s.arc) tags.push(`<span class="tag">${ARCS[s.arc]||esc(s.arc)}</span>`); if(s.attribution) tags.push(`<span class="tag ${s.attribution.status==="study_exists"?"evidence":s.attribution.status==="no_study"?"gap":""}">${ATTRIB[s.attribution.status]}</span>`); if(s.nl_eu) tags.push(`<span class="tag">NL/EU: ${esc(s.nl_eu.level)}</span>`); }
    else { tags.push(`<span class="tag ${esc(s.verdict)}">${VERDICTS[s.verdict]||esc(s.verdict)}</span>`); if(s.confidence) tags.push(`<span class="tag">${esc(s.confidence)} confidence</span>`); }
    if(o.geoKind) tags.push(`<span class="tag">${esc(o.label)}: ${KINDMARK[o.geoKind]||esc(o.geoKind)}</span>`);
    html += `<div class="tags">${tags.join("")}</div><p>${esc(o.summary)}</p>`;
    if(o.locNote) html += `<p class="meta">${esc(o.locNote)}</p>`;
    foot = `<a class="go" href="index.html?id=${weekId}#${o.id}">Read in Week ${d.week_number} digest →</a>`;
  }
  html += `</div>` + foot;
  pop.innerHTML = html; pop.classList.add("on");
  pop.querySelector(".x").addEventListener("click", closePop);
  positionPop();
  const bod = pop.querySelector(".bod");
  pop.classList.toggle("scrolls", bod.scrollHeight > bod.clientHeight + 1);
}
function closePop(){ selected=null; pop.classList.remove("on"); gMarks.selectAll("g.mk").classed("sel",false); }
function positionPop(){
  if(!selected) return;
  const o = selected, k=t.k;
  const sx = t.applyX(o.x) + o.dx, sy = t.applyY(o.y) + o.dy;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = sx + 22, top = sy - 24;
  if(left + pw > W - 12) left = sx - pw - 22;
  if(left < 12) left = 12;
  if(top + ph > H - 12) top = H - ph - 12;
  if(top < 12) top = 12;
  pop.style.left = left+"px"; pop.style.top = top+"px";
}

boot().catch(e => { document.getElementById("state").textContent = "The map could not be loaded. Check your connection and reload."; console.error(e); });
</script>
